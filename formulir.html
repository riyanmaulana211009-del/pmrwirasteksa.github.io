<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulir Pendaftaran - PMR Wira SMK Negeri 1 Sagaranten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="page-fade">
<header>
  <button class="hamburger" aria-label="Buka menu" aria-expanded="false">
    <span class="hamburger-bars"><i class="fa-solid fa-bars"></i></span>
    <span class="hamburger-x"><i class="fa-solid fa-xmark"></i></span>
  </button>
  <div class="logo-wrap">
    <img src="assets/logo.png" alt="Logo">
    <div class="logo-fallback">PW</div>
  </div>
  <div class="nav-overlay"></div>
  <div class="nav-dropdown" role="menu">
    <a href="index.html" role="menuitem">Beranda</a>
    <a href="profil.html" role="menuitem">Profil</a>
    <a href="struktur.html" role="menuitem">Struktur Organisasi</a>
    <a href="pendaftaran.html" role="menuitem">Pendaftaran Anggota Baru</a>
    <a href="kontak.html" role="menuitem">Kontak</a>
  </div>
  <h1 class="page-title">PMR WIRA SMK NEGERI 1 SAGARANTEN</h1>
  <p class="page-subtitle">Formulir Pendaftaran</p>
  <div class="header-divider" aria-hidden="true">
    <span class="hd-line hd-line--l"></span>
    <span class="hd-cross"><i class="fa-solid fa-plus"></i></span>
    <span class="hd-line hd-line--r"></span>
  </div>
</header>

<div class="container content-area page-fade">
  <a href="pendaftaran.html" class="btn-back">Kembali</a>
  <div class="card reveal">
    <form class="daftar-form">
      <div class="field-group">
        <label class="field-label"><i class="fa-solid fa-user"></i> Nama Lengkap</label>
        <input type="text" name="nama" class="field-input" placeholder="Masukkan nama lengkap Anda" maxlength="100">
      </div>
      <div class="field-group">
        <label class="field-label"><i class="fa-solid fa-graduation-cap"></i> Kelas</label>
        <input type="text" name="kelas" class="field-input" placeholder="Mis. X TKJ 1" maxlength="60">
      </div>
      <div class="field-group">
        <label class="field-label"><i class="fa-solid fa-heart"></i> Alasan Masuk PMR</label>
        <textarea name="alasan" class="field-input" rows="3" placeholder="Tuliskan alasan Anda ingin gabung PMR" maxlength="1000"></textarea>
        <span class="char-counter">0/1000</span>      <div class="field-group">
        <label class="field-label"><i class="fa-solid fa-seedling"></i> Harapan</label>
        <textarea name="harapan" class="field-input" rows="3" placeholder="Tuliskan harapan Anda setelah gabung PMR" maxlength="1000"></textarea>
        <span class="char-counter">0/1000</span>
      </div>
      <div style="position:absolute; left:-9999px; display:none; visibility:hidden;">
        <label>Jangan isi kolom ini</label>
        <input type="text" name="website" tabindex="-1" autocomplete="off">
      </div>
      <button type="submit" class="btn-submit"><i class="fa-solid fa-paper-plane"></i> Kirim Pendaftaran</button>
    </form>
    <div class="form-error-msg" style="color:var(--merah-judul); font-size:0.85rem; margin-top:10px; display:none;"></div>
    <div class="msg-success">
      <div class="check-icon"><i class="fa-solid fa-check"></i></div>
      <h3>Pendaftaran Terkirim!</h3>
      <p>Data Anda telah tersimpan. Tunggu konfirmasi selanjutnya.</p>
      <button type="button" class="btn-wa-confirm" style="margin-top:14px; background:var(--wa); color:#fff; border:none; padding:10px 20px; border-radius:10px; font-family:'Poppins',sans-serif; font-weight:700; cursor:pointer; width:auto; display:inline-flex; align-items:center; gap:8px; box-shadow:0 4px 12px rgba(37,211,102,0.3);">
        <i class="fa-brands fa-whatsapp"></i> Konfirmasi via WhatsApp
      </button>
    </div>
  </div>
</div><button class="btn-scrolltop" aria-label="Naik ke atas"><i class="fa-solid fa-arrow-up"></i></button>


<script src="js/script.js"></script>
</body>
</html>
