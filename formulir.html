<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulir Pendaftaran - PMR Wira SMK Negeri 1 Sagaranten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="page-fade firebase-form">
<header>
  <button class="hamburger" aria-label="Buka menu" aria-expanded="false">
    <span class="hamburger-bars"><i class="fa-solid fa-bars"></i></span>
    <span class="hamburger-x"><i class="fa-solid fa-xmark"></i></span>
  </button>
  <div class="logo-wrap">
    <img src="assets/logo.png" alt="Logo">
    <div class="logo-fallback">PW</div>
  </div>
  <div class="nav-overlay"></div>
  <div class="nav-dropdown" role="menu">
    <a href="index.html" role="menuitem">Beranda</a>
    <a href="profil.html" role="menuitem">Profil</a>
    <a href="struktur.html" role="menuitem">Struktur Organisasi</a>
    <a href="pendaftaran.html" role="menuitem">Pendaftaran Anggota Baru</a>
    <a href="kontak.html" role="menuitem">Kontak</a>
  </div>
  <h1 class="page-title">PMR WIRA SMK NEGERI 1 SAGARANTEN</h1>
  <p class="page-subtitle">Formulir Pendaftaran</p>
  <div class="header-divider" aria-hidden="true">
    <span class="hd-line hd-line--l"></span>
    <span class="hd-cross"><i class="fa-solid fa-plus"></i></span>
    <span class="hd-line hd-line--r"></span>
  </div>
</header>

<div class="container content-area page-fade">
  <a href="pendaftaran.html" class="btn-back">Kembali</a>
  <div class="card reveal">
    <form class="daftar-form">
      <div class="field-group">
        <label class="field-label"><i class="fa-solid fa-user"></i> Nama Lengkap</label>
        <input type="text" name="nama" class="field-input" placeholder="Masukkan nama lengkap Anda" maxlength="100">
      </div>
      <div class="field-group">
        <label class="field-label"><i class="fa-solid fa-graduation-cap"></i> Kelas</label>
        <input type="text" name="kelas" class="field-input" placeholder="Mis. X TKJ 1" maxlength="60">
      </div>
      <div class="field-group">
        <label class="field-label"><i class="fa-solid fa-heart"></i> Alasan Masuk PMR</label>
        <textarea name="alasan" class="field-input" rows="3" placeholder="Tuliskan alasan Anda ingin gabung PMR" maxlength="1000"></textarea>
        <span class="char-counter">0/1000</span>      <div class="field-group">
        <label class="field-label"><i class="fa-solid fa-seedling"></i> Harapan</label>
        <textarea name="harapan" class="field-input" rows="3" placeholder="Tuliskan harapan Anda setelah gabung PMR" maxlength="1000"></textarea>
        <span class="char-counter">0/1000</span>
      </div>
      <div style="position:absolute; left:-9999px; display:none; visibility:hidden;">
        <label>Jangan isi kolom ini</label>
        <input type="text" name="website" tabindex="-1" autocomplete="off">
      </div>
      <button type="submit" class="btn-submit"><i class="fa-solid fa-paper-plane"></i> Kirim Pendaftaran</button>
    </form>
    <div class="form-error-msg" style="color:var(--merah-judul); font-size:0.85rem; margin-top:10px; display:none;"></div>
    <div class="msg-success">
      <div class="check-icon"><i class="fa-solid fa-check"></i></div>
      <h3>Pendaftaran Terkirim!</h3>
      <p>Data Anda telah tersimpan. Tunggu konfirmasi selanjutnya.</p>
      <button type="button" class="btn-wa-confirm" style="margin-top:14px; background:var(--wa); color:#fff; border:none; padding:10px 20px; border-radius:10px; font-family:'Poppins',sans-serif; font-weight:700; cursor:pointer; width:auto; display:inline-flex; align-items:center; gap:8px; box-shadow:0 4px 12px rgba(37,211,102,0.3);">
        <i class="fa-brands fa-whatsapp"></i> Konfirmasi via WhatsApp
      </button>
    </div>
  </div>
</div><button class="btn-scrolltop" aria-label="Naik ke atas"><i class="fa-solid fa-arrow-up"></i></button>

<script type="module" src="js/firebase-init.js"></script>
<script type="module">
  import { db } from './js/firebase-init.js';
  import { collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const form = document.querySelector('form.daftar-form');
  const btn = form.querySelector('.btn-submit');
  const msg = document.querySelector('.msg-success');
  const errMsg = document.querySelector('.form-error-msg');
  const btnWa = document.querySelector('.btn-wa-confirm');
  const namaInput = form.querySelector('input[name="nama"]');
  const kelasInput = form.querySelector('input[name="kelas"]');
  const alasanTextarea = form.querySelector('textarea[name="alasan"]');
  const harapanTextarea = form.querySelector('textarea[name="harapan"]');
  const honeypot = form.querySelector('input[name="website"]');

  let lastSubmitTime = 0;
  let isSubmitting = false;

  function setupCounter(textarea, counter) {
    textarea.addEventListener('input', function() {
      counter.textContent = this.value.length + '/1000';
    });
  }
  const counters = document.querySelectorAll('.char-counter');
  if (alasanTextarea && counters[0]) setupCounter(alasanTextarea, counters[0]);
  if (harapanTextarea && counters[1]) setupCounter(harapanTextarea, counters[1]);

  function showError(input, message) {
    input.classList.add('error');
    var existing = input.parentNode.querySelector('.field-error');
    if (existing) existing.remove();
    var err = document.createElement('div');
    err.className = 'field-error show';
    err.textContent = message;
    input.parentNode.appendChild(err);
    input.focus();
  }
  function clearError(input) {
    input.classList.remove('error');
    var existing = input.parentNode.querySelector('.field-error');
    if (existing) existing.remove();
  }
  function clearAllErrors() {
    clearError(namaInput); clearError(kelasInput); clearError(alasanTextarea); clearError(harapanTextarea);
  }
  function showFormError(message) {
    errMsg.textContent = message;
    errMsg.style.display = 'block';
  }
  function hideFormError() {
    errMsg.style.display = 'none';
  }
  function openWhatsApp(nama, kelas, alasan, harapan) {
    var pesan = 'Halo, saya ingin konfirmasi pendaftaran PMR Wira.%0A%0A';
    pesan += '*Nama:* ' + encodeURIComponent(nama) + '%0A';
    pesan += '*Kelas:* ' + encodeURIComponent(kelas) + '%0A';
    pesan += '*Alasan masuk PMR:* ' + encodeURIComponent(alasan) + '%0A';
    pesan += '*Harapan:* ' + encodeURIComponent(harapan);
    window.open('https://wa.me/6283808146592?text=' + pesan, '_blank');
  }
  btnWa.addEventListener('click', function() {
    openWhatsApp(namaInput.value.trim(), kelasInput.value.trim(), alasanTextarea.value.trim(), harapanTextarea.value.trim());
  });

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    if (isSubmitting) return;
    if (honeypot && honeypot.value.trim() !== '') {
      msg.classList.add('show');
      form.reset();
      counters.forEach(function(c) { c.textContent = '0/1000'; });
      btnWa.style.display = 'none';
      return;
    }
    var now = Date.now();
    if (now - lastSubmitTime < 3000) {
      showFormError('Tunggu beberapa saat sebelum mengirim lagi.');
      return;
    }
    clearAllErrors();
    hideFormError();
    var valid = true;
    if (!namaInput.value.trim()) { showError(namaInput, 'Nama lengkap harus diisi.'); valid = false; }
    if (!kelasInput.value.trim()) { showError(kelasInput, 'Kelas harus diisi.'); valid = false; }
    if (!alasanTextarea.value.trim()) { showError(alasanTextarea, 'Alasan masuk PMR harus diisi.'); valid = false; }
    if (!harapanTextarea.value.trim()) { showError(harapanTextarea, 'Harapan Anda harus diisi.'); valid = false; }
    if (!valid) return;
    isSubmitting = true;
    lastSubmitTime = now;
    btn.classList.add('loading');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Mengirim...';
    try {
      addDoc(collection(db, 'pendaftaran'), {
        nama: namaInput.value.trim(),
        kelas: kelasInput.value.trim(),
        alasan: alasanTextarea.value.trim(),
        harapan: harapanTextarea.value.trim(),
        createdAt: serverTimestamp()
      }).then(function() {
        btn.classList.remove('loading');
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Kirim Pendaftaran';
        msg.classList.add('show');
        btnWa.style.display = 'inline-flex';
        form.reset();
        counters.forEach(function(c) { c.textContent = '0/1000'; });
        hideFormError();
      }).catch(function(err) {
        console.error('Firestore error:', err);
        btn.classList.remove('loading');
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Kirim Pendaftaran';
        showFormError('Pendaftaran gagal terkirim. Periksa koneksi lalu coba lagi.');
        isSubmitting = false;
      });
    } catch (err) {
      console.error('Submit error:', err);
      btn.classList.remove('loading');
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Kirim Pendaftaran';
      showFormError('Pendaftaran gagal terkirim. Periksa koneksi lalu coba lagi.');
      isSubmitting = false;
    }
  });
</script>

<script src="js/script.js"></script>
</body>
</html>
