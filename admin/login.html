<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin - PMR Wira Steksa</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .kotak {
      background: #fff;
      padding: 32px 24px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 2px 10px rgba(0,0,0,.1);
      max-width: 340px;
      width: 90%;
    }
    h1 { font-size: 20px; margin: 0 0 8px; color: #c0392b; }
    p { color: #555; font-size: 14px; margin: 0 0 20px; }
    #tombol-google { display: flex; justify-content: center; }
  </style>
</head>
<body>
  <div class="kotak">
    <h1>Admin PMR Wira Steksa</h1>
    <p>Masuk menggunakan akun Google admin.</p>
    <div id="tombol-google"></div>
  </div>
  <script src="js/auth.js"></script>
</body>
</html>
