<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengaturan Akun - PMR Wira Steksa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="page-enter">
  <button class="admin-hamburger" id="hamburger" aria-label="Buka Menu"><i class="fa-solid fa-bars"></i></button>
  <div class="admin-overlay" id="overlay" onclick="toggleSidebar()"></div>

  <div class="admin-sidebar" id="sidebar">
    <div class="admin-sidebar-header">
      <div class="logo">PW</div>
      <h2>PMR Wira Steksa</h2>
      <p>Admin Panel</p>
    </div>
    <nav>
      <ul>
        <li><a href="dashboard.html" onclick="closeSidebar()"><i class="fa-solid fa-chart-pie"></i> Dashboard</a></li>
        <li><a href="pendaftaran.html" onclick="closeSidebar()"><i class="fa-solid fa-users"></i> Data Pendaftaran</a></li>
        <li><a href="pengaturan.html" class="active" onclick="closeSidebar()"><i class="fa-solid fa-gear"></i> Pengaturan</a></li>
      </ul>
    </div>
    <div class="admin-sidebar-footer">
      <button class="btn-logout" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Keluar</button>
    </div>
  </div>

  <div class="admin-main">
    <div class="admin-topbar">
      <h1><i class="fa-solid fa-gear"></i> Pengaturan Akun</h1>
      <a href="dashboard.html" class="btn-secondary"><i class="fa-solid fa-arrow-left"></i> Kembali</a>
    </div>

    <div class="card" style="max-width: 520px; margin: 0 auto;">
      <div class="card-header">
        <h3><i class="fa-solid fa-user-shield"></i> Profil Admin</h3>
      </div>

      <form id="formPengaturan" onsubmit="return simpanPengaturan(event)">
        <div class="form-group">
          <label>Nama Lengkap</label>
          <input type="text" value="Admin PMR" disabled>
        </div>
        <div class="form-group">
          <label>Email Admin</label>
          <input type="email" value="admin@pmrste.sch.id" disabled>
        </div>
        <div class="form-group">
          <label>Password Baru</label>
          <input type="password" id="inputPassword" placeholder="Masukkan password baru">
        </div>
        <div class="form-group">
          <label>Konfirmasi Password</label>
          <input type="password" id="inputKonfirmasi" placeholder="Konfirmasi password baru">
        </div>
        <button type="submit" class="btn-primary mt-16">Simpan Perubahan</button>
      </form>

      <div class="text-center mt-16">
        <button type="button" class="btn-secondary" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Keluar dari Akun</button>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
